name: cf-test
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Bedrock versions and types
        env:
          T: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          curl -s -H "X-Api-Token: $T" "https://minecraft-bedrock.curseforge.com/api/game/versions" -o v.json
          echo "total versions: $(jq 'length' v.json)"
          echo "--- newest 20 by id ---"
          jq -r 'sort_by(.id) | .[-20:][] | "\(.id)\t\(.name)\ttype=\(.gameVersionTypeID)"' v.json
          echo "--- version types ---"
          curl -s -H "X-Api-Token: $T" "https://minecraft-bedrock.curseforge.com/api/game/version-types" | jq -r '.[] | "\(.id)\t\(.name)"'
